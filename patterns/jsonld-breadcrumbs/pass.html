<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rye sourdough starter | Northwind Supply</title>
  <meta property="og:url" content="https://www.northwind.example/baking/starters/rye-starter">

  <!-- One item per level of the path, plus the home page, positions counting
       from one, absolute URLs, and the last item is this page.

       Generate it from the URL rather than typing it per template. The trail
       and the path then cannot disagree, which is the only failure in this
       area that survives review, because a hand-written trail is internally
       valid and simply describes somewhere else. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home",
        "item": "https://www.northwind.example/" },
      { "@type": "ListItem", "position": 2, "name": "Baking",
        "item": "https://www.northwind.example/baking" },
      { "@type": "ListItem", "position": 3, "name": "Starters",
        "item": "https://www.northwind.example/baking/starters" },
      { "@type": "ListItem", "position": 4, "name": "Rye sourdough starter",
        "item": "https://www.northwind.example/baking/starters/rye-starter" }
    ]
  }
  </script>
</head>
<body>
  <nav aria-label="Breadcrumb">
    <ol>
      <li><a href="/">Home</a></li>
      <li><a href="/baking">Baking</a></li>
      <li><a href="/baking/starters">Starters</a></li>
      <li><a href="/baking/starters/rye-starter" aria-current="page">Rye sourdough starter</a></li>
    </ol>
  </nav>
  <h1>Rye sourdough starter</h1>
</body>
</html>
